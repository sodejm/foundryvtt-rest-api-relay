name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
            source-root: go-relay
            config: .github/codeql/codeql-go.yml
          - language: javascript-typescript
            build-mode: none
            source-root: .
            config: .github/codeql/codeql-config.yml
          - language: python
            build-mode: none
            source-root: .
            config: .github/codeql/codeql-config.yml
          - language: actions
            build-mode: none
            source-root: .
            config: .github/codeql/codeql-config.yml
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go-relay/go.mod
          cache-dependency-path: go-relay/go.sum

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.gz
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          source-root: ${{ matrix.source-root }}
          config-file: ${{ matrix.config }}

      - name: Build Go for extraction
        if: matrix.language == 'go'
        working-directory: go-relay
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Analyze source
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

      # Run after production analysis: the deliberately unsafe fixtures live in
      # their own Go module outside go-relay and must never enter its database.
      - name: Test admin authorization query
        if: matrix.language == 'go'
        env:
          CODEQL_PATH: ${{ steps.init.outputs.codeql-path }}
          CGO_ENABLED: '0'
        run: '"${CODEQL_PATH}" test run .github/codeql/go/tests --threads=2'
